org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
org.gradle.daemon=false

# Enable Gradle caching
org.gradle.caching=true

# Parallel builds
org.gradle.parallel=true

# Non-transitive R classes for smaller DEX
android.nonTransitiveRClass=true

# Disable jetifier (not needed for new projects)
android.enableJetifier=false

# Suppress KGP warning (flutter_patcher uses KGP, will be fixed by plugin author)
kotlin.suppressGradlePluginWarnings=KotlinGradlePluginMigration,KGPUseDeprecated
