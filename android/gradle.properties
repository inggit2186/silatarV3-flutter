org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
org.gradle.daemon=false

# Enable Gradle caching
org.gradle.caching=true

# Parallel builds
org.gradle.parallel=true

# Non-transitive R classes for smaller DEX
android.nonTransitiveRClass=true

# Disable jetifier (not needed for new projects)
android.enableJetifier=false

# Suppress KGP warning (flutter_patcher uses KGP, will be fixed by plugin author)
kotlin.suppressGradlePluginWarnings=KotlinGradlePluginMigration,KGPUseDeprecated

# Disable Kotlin incremental compilation.
# Penyebab: project berada di drive D: sedangkan pub cache di drive C:,
# sehingga Kotlin incremental cache gagal menghitung path relatif
# ("this and base files have different roots") dan build gagal.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false

# Jalankan compiler Kotlin di proses Gradle (hindari Kotlin daemon yang bermasalah)
kotlin.compiler.execution.strategy=in-process
